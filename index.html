  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-label="Skolappar laddas">
        <img src="/favicon.png" alt="" width="64" height="64" />
        <strong>Skolappar</strong>
        <span class="app-loading__dot" aria-hidden="true"></span>
      </div>
    </div>
    <style>
      :root {
        --loading-background: 45 100% 98%;
        --loading-foreground: 240 20% 15%;
        --loading-primary: 12 90% 58%;
        --loading-secondary: 174 72% 46%;
      }
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: hsl(var(--loading-background)); }
      .app-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: hsl(var(--loading-foreground));
        font-family: ui-rounded, system-ui, sans-serif;
        background: linear-gradient(160deg, hsl(var(--loading-background)), hsl(var(--loading-primary) / .08), hsl(var(--loading-secondary) / .08));
      }
      .app-loading img { border-radius: 16px; }
      .app-loading strong { font-size: 20px; }
      .app-loading__dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: hsl(var(--loading-primary));
        animation: loading-pulse 1s ease-in-out infinite alternate;
      }
      @keyframes loading-pulse { to { opacity: .35; transform: scale(.8); } }
      @media (prefers-reduced-motion: reduce) { .app-loading__dot { animation: none; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
